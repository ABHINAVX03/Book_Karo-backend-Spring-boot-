# ============================================
# TEST FLYWAY CONFIGURATION
# ============================================

# DB CONFIG - Testcontainers will override this
spring.datasource.url=jdbc:tc:postgresql:12:///uber_test?TC_DAEMON=true
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS postgis

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=0
spring.jpa.open-in-view=false

# FLYWAY - TEST SETTINGS
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-future-migrations=false
spring.flyway.ignore-ignored-migrations=false
spring.flyway.out-of-order=false
spring.flyway.repair=false
spring.flyway.placeholders.enabled=true
spring.flyway.placeholders.application-name=uber-app-test

# SQL INITIALIZATION - TEST
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# OBSERVABILITY
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
server.shutdown=immediate

# TESTING
logging.level.org.flywaydb=INFO
logging.level.org.springframework.test=WARN
logging.level.com.zaxxer.hikari=WARN

# SECURITY - TEST
app.security.jwt-secret=test-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
app.security.jwt-issuer=uber-app-test
app.security.jwt-audience=uber-web-test
app.security.access-token-minutes=5
app.security.refresh-token-days=1
app.security.login-max-attempts=5
app.security.login-max-attempts-per-minute=10
app.security.refresh-max-attempts-per-minute=20
app.security.otp-max-attempts=5
app.security.otp-max-sends-per-window=3
app.security.otp-max-requests-per-minute=6
app.security.otp-verify-max-requests-per-minute=10
app.security.refresh-cookie-secure=false
app.security.refresh-cookie-same-site=Lax
app.security.access-cookie-secure=false
app.security.access-cookie-same-site=Lax
app.security.captcha-enabled=false
app.security.allowed-origins=http://localhost:3000

# PAYMENTS - TEST
razorpay.key-id=test_razorpay_key_id
razorpay.key-secret=test_razorpay_key_secret

# SMTP CONFIG - TEST (Mock)
spring.mail.host=localhost
spring.mail.port=0
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CLOUDINARY CONFIG - TEST
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

# TWILIO CONFIG - TEST
twilio.account-sid=test_account_sid
twilio.auth-token=test_auth_token
twilio.phone-number=+15005550006

# TEST FEATURES
app.features.enable-migration-validation=true
app.features.enable-migration-health-check=true
app.features.enable-migration-rollback-testing=true
app.features.enable-database-seeding=false

# TEST CONTAINERS
spring.testcontainers.containers.postgres.enabled=true
spring.testcontainers.containers.postgres.image=postgis/postgis:12-3.0