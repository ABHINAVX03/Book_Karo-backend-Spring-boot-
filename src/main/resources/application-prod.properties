# DB CONFIG (set via SPRING_DATASOURCE_* env vars on Railway/host)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS postgis

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
server.port=${PORT:8080}
spring.jpa.open-in-view=false

# SECURITY
app.security.jwt-secret=${JWT_SECRET_KEY}
app.security.jwt-issuer=${JWT_ISSUER:bookcar-api}
app.security.jwt-audience=${JWT_AUDIENCE:bookcar-web}
app.security.access-token-minutes=${ACCESS_TOKEN_MINUTES:60}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.security.login-max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login-max-attempts-per-minute=${LOGIN_MAX_ATTEMPTS_PER_MINUTE:10}
app.security.refresh-max-attempts-per-minute=${REFRESH_MAX_ATTEMPTS_PER_MINUTE:20}
app.security.otp-max-attempts=${OTP_MAX_ATTEMPTS:5}
app.security.otp-max-requests-per-minute=${OTP_MAX_REQUESTS_PER_MINUTE:6}
app.security.otp-verify-max-requests-per-minute=${OTP_VERIFY_MAX_REQUESTS_PER_MINUTE:10}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:None}
app.security.access-cookie-secure=${ACCESS_COOKIE_SECURE:true}
app.security.access-cookie-same-site=${ACCESS_COOKIE_SAME_SITE:None}
app.security.captcha-enabled=${CAPTCHA_ENABLED:false}
app.security.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.otp.log-enabled=${APP_OTP_LOG_ENABLED:false}

# PAYMENTS
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# SMTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# ============================================
# PRODUCTION FLYWAY CONFIGURATION
# ============================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=<< Flyway Baseline >>
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.encoding=UTF-8
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffixes=.sql
spring.flyway.repeatable-sql-migration-prefix=R
spring.flyway.clean-disabled=true
spring.flyway.clean-on-validation-error=false
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.out-of-order=false
spring.flyway.mixed=false
spring.flyway.group=false
spring.flyway.ignore-migration-patterns=*:missing,*:future,*:ignored
spring.flyway.installed-by=${spring.datasource.username}
spring.flyway.target=latest
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=10
spring.flyway.lock-retry-count=10
spring.flyway.skip-default-callbacks=false
spring.flyway.skip-default-resolvers=false
spring.flyway.placeholders.enabled=true
spring.flyway.placeholders.application-name=${spring.application.name}
spring.flyway.placeholders.environment=production

spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CLOUDINARY (use CLOUDINARY_* — not cloudinary.cloud-name)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# DOCUMENT STORAGE (Cloudinary primary; local fallback if Cloudinary fails)
app.storage.fallbacks=${STORAGE_FALLBACKS:local}
app.storage.local.directory=${STORAGE_LOCAL_DIR:uploads}
app.storage.local.base-url=${STORAGE_LOCAL_BASE_URL:}
app.storage.s3.enabled=${STORAGE_S3_ENABLED:false}
app.storage.s3.bucket=${STORAGE_S3_BUCKET:}
app.storage.s3.region=${STORAGE_S3_REGION:ap-south-1}
app.storage.s3.public-base-url=${STORAGE_S3_PUBLIC_BASE_URL:}

# ADMIN EMAIL when driver submits verification
app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}

# DEV ENDPOINTS — must stay false in production
app.dev.endpoints-enabled=false
