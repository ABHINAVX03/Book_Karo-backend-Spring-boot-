# ============================================
# DEVELOPMENT FLYWAY CONFIGURATION
# ============================================

# DB CONFIG
spring.datasource.url=jdbc:postgresql://localhost:5432/uber_dev
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS postgis

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.jpa.open-in-view=false

# FLYWAY - DEVELOPMENT SETTINGS
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-future-migrations=false
spring.flyway.ignore-ignored-migrations=false
spring.flyway.out-of-order=false
spring.flyway.repair=true
spring.flyway.placeholders.enabled=true
spring.flyway.placeholders.application-name=uber-app-dev

# SQL INITIALIZATION - DEVELOPMENT
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.data-locations=classpath:data.sql

# OBSERVABILITY
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# DEBUGGING
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# MULTIPART CONFIG
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SECURITY - DEVELOPMENT (RELAXED)
app.security.jwt-secret=dev-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
app.security.jwt-issuer=uber-app-dev
app.security.jwt-audience=uber-web-dev
app.security.access-token-minutes=60
app.security.refresh-token-days=30
app.security.login-max-attempts=10
app.security.login-max-attempts-per-minute=20
app.security.refresh-max-attempts-per-minute=30
app.security.otp-max-attempts=10
app.security.otp-max-requests-per-minute=10
app.security.otp-verify-max-requests-per-minute=20
app.security.refresh-cookie-secure=false
app.security.refresh-cookie-same-site=Lax
app.security.access-cookie-secure=false
app.security.access-cookie-same-site=Lax
app.security.captcha-enabled=false
app.security.allowed-origins=http://localhost:3000,http://localhost:5173

# PAYMENTS - DEVELOPMENT
razorpay.key-id=dev_razorpay_key_id
razorpay.key-secret=dev_razorpay_key_secret

# SMTP CONFIG - DEVELOPMENT
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CLOUDINARY CONFIG - DEVELOPMENT
cloudinary.cloud-name=dev-cloud
cloudinary.api-key=dev-api-key
cloudinary.api-secret=dev-api-secret

# DEVELOPMENT FEATURES
app.features.enable-migration-validation=true
app.features.enable-migration-health-check=true
app.features.enable-migration-rollback-testing=true
app.features.enable-database-seeding=true
